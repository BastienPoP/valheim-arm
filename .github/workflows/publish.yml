# Build the ARM64 image and publish it to GHCR and (optionally) Docker Hub.
#
# Runs natively on GitHub's free ARM64 runner, so there is no QEMU step and the
# build takes minutes rather than hours.
#
# GHCR needs no setup: GITHUB_TOKEN is enough.
# Docker Hub is skipped unless both secrets exist:
#   Settings → Secrets and variables → Actions → New repository secret
#     DOCKERHUB_USERNAME   your Docker Hub login
#     DOCKERHUB_TOKEN      a token from hub.docker.com → Account settings → Personal access tokens

name: Publish image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # GHCR rejects uppercase in image names, and GitHub usernames may have it.
      - name: Compute image names
        id: names
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          ghcr="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          images="${ghcr}"
          if [ -n "${DOCKERHUB_USERNAME}" ]; then
            images="${images}"$'\n'"docker.io/${DOCKERHUB_USERNAME}/valheim-arm"
            echo "dockerhub=true" >> "$GITHUB_OUTPUT"
          fi
          { echo "images<<EOF"; echo "${images}"; echo "EOF"; } >> "$GITHUB_OUTPUT"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.images }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=valheim-arm
            org.opencontainers.image.description=Valheim dedicated server on ARM64, running the official x86_64 Linux build under Box64

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request' && steps.names.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # A pull request builds without pushing: the image is checked, nothing is
      # published. linux/arm64 only -- on x86_64 you would run the server natively.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
